events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types application/json application/javascript text/css model/gltf-binary audio/mpeg audio/ogg audio/wav;

  server {
    listen 80;
    server_name legend.jimmyy512.com;

    root /usr/share/nginx/html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html 不能長期快取，否則部署新版後玩家會拿到舊 HTML 指向已經不存在的 js 檔
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
